name: Buat APK BELMALT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode BELMALT
        uses: actions/checkout@v4

      - name: Siapkan Android
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/belmalt/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          cp index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BELMALT"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.belmalt.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.belmalt.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
          }
          }
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1261C9</item>
                  <item name="android:statusBarColor">#1261C9</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

                    cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="belmalt_blue">#1261C9</color>
          </resources>
          EOF

                    cat > android/app/src/main/res/drawable/belmalt_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#1261C9"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M27,40 L81,40 L76,88 L32,88 Z"/>

              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:fillColor="@android:color/transparent"
                  android:pathData="M42,40 C42,20 66,20 66,40"/>

              <path
                  android:fillColor="#1261C9"
                  android:pathData="M43,52 L55,52 C63,52 67,55 67,60 C67,64 65,66 62,67 C66,68 69,71 69,76 C69,82 64,85 56,85 L43,85 Z M50,57 L50,64 L55,64 C58,64 60,62 60,60 C60,58 58,57 55,57 Z M50,70 L50,79 L56,79 C60,79 62,77 62,74 C62,71 60,70 56,70 Z"/>

          </vector>
          EOF

                    cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/belmalt_blue"/>
              <foreground android:drawable="@drawable/belmalt_icon"/>
          </adaptive-icon>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

                                <application
                      android:theme="@style/AppTheme"
                      android:label="BELMALT"
                      android:icon="@mipmap/ic_launcher">

                      <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/belmalt/app/MainActivity.java <<'EOF'
          package com.belmalt.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams fileChooserParams) {

                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }

                          MainActivity.this.filePathCallback = callback;

                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");

                          Intent chooser = Intent.createChooser(
                          intent,
                          "Pilih Foto Toko"
                          );
                          
                          startActivityForResult(
                          chooser,
                          FILE_CHOOSER_REQUEST_CODE
                          );

                          return true;
                      }
                  });

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      Uri[] results = null;

                      if (resultCode == Activity.RESULT_OK && data != null) {
                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[]{uri};
                          }
                      }

                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  }
              }
          }
          EOF

      - name: Pasang Gradle
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Buat APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK BELMALT
        uses: actions/upload-artifact@v4
        with:
          name: BELMALT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
