<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BELMALT - Belanja Maluku Terlengkap</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f7fb;color:#222;padding-bottom:75px}
header{background:#1261c9;color:white;padding:20px 16px;border-radius:0 0 22px 22px}
.logo{font-size:28px;font-weight:bold}
.slogan{font-size:13px;margin-top:4px}
.search{margin-top:16px;background:white;color:#777;padding:13px;border-radius:12px}
.search input{border:0;outline:0;width:85%;font-size:14px}
.container{padding:18px 16px}
.judul{font-size:19px;font-weight:bold;margin:20px 0 13px}
.banner{background:#1261c9;color:white;border-radius:16px;padding:20px;margin-bottom:20px}
.banner h2{font-size:20px;margin-bottom:7px}
.banner p{font-size:13px}
.kategori{display:flex;gap:12px;overflow-x:auto}
.kategori-item{min-width:78px;background:white;border-radius:14px;padding:13px 7px;text-align:center;box-shadow:0 2px 8px #ddd;cursor:pointer}
.kategori-icon{font-size:27px;margin-bottom:5px}
.kategori-item p{font-size:11px}
.produk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.produk{background:white;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #ddd;cursor:pointer}
.gambar{height:135px;background:#eaf0f8;display:flex;align-items:center;justify-content:center;font-size:52px}
.info{padding:12px}
.nama{font-size:14px;font-weight:bold;margin-bottom:7px}
.harga{color:#1261c9;font-weight:bold}
.lokasi{font-size:11px;color:#777;margin-top:5px}
.tombol{margin-top:9px;width:100%;border:0;background:#1261c9;color:white;padding:9px;border-radius:9px;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;height:68px;background:white;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -2px 10px #ddd;z-index:10}
.nav{text-align:center;color:#777;font-size:11px;cursor:pointer}
.nav span{display:block;font-size:22px;margin-bottom:3px}
.nav.active{color:#1261c9;font-weight:bold}
#pesan{position:fixed;top:20px;left:15px;right:15px;background:#222;color:white;padding:13px;border-radius:10px;text-align:center;display:none;z-index:20}
</style>
</head>

<body>

<div id="pesan"></div>

<header>
<div class="logo">BELMALT</div>
<div class="slogan">Belanja Maluku Terlengkap</div>

<div class="search">
🔍
<input id="cari" type="text" placeholder="Cari produk di BELMALT..." oninput="cariProduk()">
</div>
</header>

<main
