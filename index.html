<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BELMALT - Belanja Maluku Terlengkap</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#222;
  padding-bottom:100px;
}

button,input,textarea,select{
  font-family:Arial,sans-serif;
}

button{
  cursor:pointer;
}

header{
  background:linear-gradient(135deg,#1261c9,#2584ef);
  color:white;
  padding:20px 16px 24px;
  border-radius:0 0 25px 25px;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.slogan{
  font-size:13px;
  margin-top:4px;
  opacity:.9;
}

.search{
  margin-top:17px;
  background:white;
  color:#777;
  padding:13px 14px;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:8px;
}

.search input{
  border:0;
  outline:0;
  width:100%;
  font-size:14px;
}

.container{
  padding:18px 16px;
}

.banner{
  background:linear-gradient(135deg,#1261c9,#2584ef);
  color:white;
  border-radius:18px;
  padding:21px;
  margin-bottom:22px;
  box-shadow:0 5px 15px rgba(18,97,201,.18);
}

.banner h2{
  font-size:20px;
  margin-bottom:7px;
}

.banner p{
  font-size:13px;
  line-height:1.5;
}

.judul{
  font-size:19px;
  font-weight:bold;
  margin:20px 0 13px;
}

.kategori{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:3px 2px 8px;
}

.kategori::-webkit-scrollbar{
  display:none;
}

.kategori-item{
  min-width:82px;
  background:white;
  border-radius:15px;
  padding:13px 7px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
  border:2px solid transparent;
  transition:.2s;
}

.kategori-item:active{
  transform:scale(.96);
}

.kategori-icon{
  font-size:27px;
  margin-bottom:5px;
}

.kategori-item p{
  font-size:11px;
}

.produk-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.produk{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.gambar{
  height:140px;
  background:#eaf0f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
}

.info{
  padding:12px;
}

.nama{
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}

.harga{
  color:#1261c9;
  font-weight:bold;
  font-size:15px;
}

.lokasi{
  font-size:11px;
  color:#777;
  margin-top:5px;
}

.tombol,
.checkout{
  margin-top:10px;
  width:100%;
  border:0;
  background:#1261c9;
  color:white;
  padding:11px;
  border-radius:9px;
  font-weight:bold;
}

.secondary{
  background:#e9edf3;
  color:#333;
}

.danger{
  background:#ffe5e5;
  color:#c00;
}

.bottom{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  height:70px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-radius:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.18);
  z-index:10;
}

.nav{
  text-align:center;
  color:#777;
  font-size:10px;
  min-width:50px;
  position:relative;
  cursor:pointer;
}

.nav span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav.active{
  color:#1261c9;
  font-weight:bold;
}

.badge{
  position:absolute;
  top:-4px;
  right:5px;
  background:red;
  color:white;
  font-size:10px;
  min-width:17px;
  height:17px;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
}

#pesan{
  position:fixed;
  top:20px;
  left:15px;
  right:15px;
  background:#222;
  color:white;
  padding:13px;
  border-radius:10px;
  text-align:center;
  display:none;
  z-index:100;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.item-keranjang{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.item-icon{
  width:55px;
  height:55px;
  border-radius:12px;
  background:#eaf0f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  flex-shrink:0;
}

.item-detail{
  flex:1;
}

.item-nama{
  font-weight:bold;
  font-size:14px;
}

.item-harga{
  color:#1261c9;
  font-size:13px;
  margin-top:4px;
}

.jumlah{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.jumlah button{
  width:28px;
  height:28px;
  border:0;
  border-radius:7px;
  background:#1261c9;
  color:white;
  font-size:17px;
}

.jumlah span{
  min-width:20px;
  text-align:center;
  font-weight:bold;
}

.hapus{
  border:0;
  background:#ffe5e5;
  color:#c00;
  padding:7px;
  border-radius:7px;
  font-size:11px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  font-size:17px;
  font-weight:bold;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  outline:none;
  background:white;
}

.form-group textarea{
  min-height:90px;
  resize:none;
}

.radio-box{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin-bottom:8px;
  font-size:13px;
}

.ringkasan-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  padding:7px 0;
}

.kosong{
  text-align:center;
  padding:50px 15px;
  color:#777;
}

.kosong .icon{
  font-size:55px;
  margin-bottom:12px;
}

.success{
  text-align:center;
  padding:30px 15px;
}

.success-icon{
  font-size:65px;
}

.nomor-pesanan{
  color:#1261c9;
  font-weight:bold;
  margin:12px 0;
}

.login-box{
  max-width:500px;
  margin:20px auto;
}

.avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#eaf0f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  margin:0 auto 15px;
}

.menu-akun{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.menu-akun:last-child{
  border-bottom:0;
}

.menu-akun button{
  border:0;
  background:none;
  font-size:14px;
}

.order-status{
  display:inline-block;
  background:#e7f1ff;
  color:#1261c9;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.chat-box{
  background:white;
  border-radius:16px;
  padding:15px;
  min-height:350px;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.chat-message{
  background:#eaf0f8;
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
  font-size:13px;
}

.chat-input{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.chat-input input{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:11px;
  outline:none;
}

.chat-input button{
  border:0;
  background:#1261c9;
  color:white;
  padding:0 15px;
  border-radius:10px;
}

.hidden{
  display:none!important;
}

@media(max-width:380px){
  .produk-grid{
    gap:9px;
  }

  .gambar{
    height:125px;
  }
}
</style>
</head>

<body>

<div id="pesan"></div>

<header>

<div class="logo">BELMALT</div>

<div class="slogan">
Belanja Maluku Terlengkap
</div>

<div class="search">
<span>🔍</span>
<input
id="cari"
type="text"
placeholder="Cari produk di BELMALT..."
oninput="cariProduk()">
</div>

</header>

<main class="container" id="halaman"></main>

<div class="bottom">

<div class="nav active" id="navBeranda" onclick="beranda()">
<span>🏠</span>
Beranda
</div>

<div class="nav" id="navKategori" onclick="tampilkanKategori()">
<span>🛍️</span>
Kategori
</div>

<div class="nav" id="navKeranjang" onclick="lihatKeranjang()">
<span>🛒</span>
<div class="badge" id="badge">0</div>
Keranjang
</div>

<div class="nav" id="navChat" onclick="chat()">
<span>💬</span>
Chat
</div>

<div class="nav" id="navAkun" onclick="akun()">
<span>👤</span>
Akun
</div>

</div>

<script>

/* =========================
   DATA BELMALT
========================= */

const SUPABASE_URL = "https://exgpfdkrwiwrgrekqdzi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_w5k8ukza2fql_Iil6ABKtw_4EYXhtpV";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);
  
const produkData = [

{
id:1,
nama:"Kaos Maluku",
harga:75000,
icon:"👕",
lokasi:"Ternate",
kategori:"Fashion",
stok:20
},

{
id:2,
nama:"Tas Wanita",
harga:120000,
icon:"👜",
lokasi:"Tidore",
kategori:"Fashion",
stok:15
},

{
id:3,
nama:"Skincare",
harga:85000,
icon:"💄",
lokasi:"Ternate",
kategori:"Kecantikan",
stok:30
},

{
id:4,
nama:"Produk Lokal",
harga:50000,
icon:"🍯",
lokasi:"Maluku Utara",
kategori:"Makanan",
stok:25
},

{
id:5,
nama:"Smartphone",
harga:1500000,
icon:"📱",
lokasi:"Ternate",
kategori:"Elektronik",
stok:10
},

{
id:6,
nama:"Peralatan Rumah",
harga:95000,
icon:"🏠",
lokasi:"Tidore",
kategori:"Rumah",
stok:18
}

];


/* =========================
   DATA LOKAL
========================= */

let keranjang =
JSON.parse(localStorage.getItem("keranjangBELMALT")) || [];

let pesanan =
JSON.parse(localStorage.getItem("pesananBELMALT")) || [];

let pengguna =
JSON.parse(localStorage.getItem("penggunaBELMALT")) || null;


/* =========================
   UTILITAS
========================= */

function rupiah(angka){

return "Rp"+
Number(angka).toLocaleString("id-ID");

}


function simpanKeranjang(){

localStorage.setItem(
"keranjangBELMALT",
JSON.stringify(keranjang)
);

updateBadge();

}


function simpanPesanan(){

localStorage.setItem(
"pesananBELMALT",
JSON.stringify(pesanan)
);

}


function pesan(teks){

const box=document.getElementById("pesan");

box.innerText=teks;

box.style.display="block";

clearTimeout(window.timerPesan);

window.timerPesan=setTimeout(function(){

box.style.display="none";

},1800);

}


function setNav(id){

document.querySelectorAll(".nav")
.forEach(function(item){

item.classList.remove("active");

});

const nav=document.getElementById(id);

if(nav){
nav.classList.add("active");
}

}


/* =========================
   BERANDA
========================= */

function beranda(){

setNav("navBeranda");

document.getElementById("cari").value="";

renderBeranda();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

async function renderBeranda(){

  document.getElementById("halaman").innerHTML=`

  <div class="banner">

    <h2>Belanja Mudah di BELMALT 🛍️</h2>

    <p>
    Temukan berbagai produk pilihan dari penjual
    di Maluku Utara dengan mudah.
    </p>

  </div>

  <div class="judul">
  Kategori
  </div>

  <div class="kategori">

  ${buatKategoriHTML()}

  </div>

  <div class="judul">
  Produk Pilihan
  </div>

  <div
  class="produk-grid"
  id="produk">

    <p style="
    grid-column:1/-1;
    text-align:center;
    color:#777">

    Memuat produk...

    </p>

  </div>

  `;

  const { data, error } =
    await supabaseClient
    .from("products")
    .select("*")
    .eq("active", true)
    .order("created_at", {
      ascending: false
    });

  if(error){

    console.error(error);

    document.getElementById("produk").innerHTML =
      buatProdukHTML(produkData);

    return;
  }

  const produkSupabase = (data || []).map(produk => ({

    id: produk.id,

    nama: produk.name,

    harga: Number(produk.price),

    stok: produk.stock,

    kategori: produk.category,

    lokasi: produk.location || "",

    deskripsi: produk.description || "",

    gambar: produk.image_url || ""

  }));

  const semuaProduk = [
    ...produkSupabase,
    ...produkData
  ];
  
window.semuaProdukBELMALT = semuaProduk;
  document.getElementById("produk").innerHTML =
    buatProdukHTML(semuaProduk);

}

/* =========================
   KATEGORI
========================= */

const kategoriData=[

["Fashion","👕"],
["Kecantikan","💄"],
["Elektronik","📱"],
["Makanan","🍜"],
["Rumah","🏠"]

];


function buatKategoriHTML(){

return kategoriData.map(function(item){

return `

<div class="kategori-item"
onclick="filterKategori('${item[0]}')">

<div class="kategori-icon">
${item[1]}
</div>

<p>${item[0]}</p>

</div>

`;

}).join("");

}


function tampilkanKategori(){

setNav("navKategori");

document.getElementById("halaman").innerHTML=`

<div class="judul">
🛍️ Semua Kategori
</div>

<div class="kategori"
style="overflow:visible;display:grid;grid-template-columns:repeat(3,1fr)">

${buatKategoriHTML()}

</div>

<div id="hasilKategori">

<div class="judul">
Semua Produk
</div>

<div class="produk-grid">

${buatProdukHTML(produkData)}

</div>

</div>

`;

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function filterKategori(namaKategori){

const hasil=
produkData.filter(function(item){

return item.kategori===namaKategori;

});

const box=document.getElementById("hasilKategori");

if(!box) return;

box.innerHTML=`

<div class="judul">
${namaKategori}
</div>

<div class="produk-grid">

${buatProdukHTML(hasil)}

</div>

`;

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   PRODUK
========================= */

function buatProdukHTML(data){

  if(data.length === 0){

    return `

    <div class="card kosong"
    style="grid-column:1/-1">

      <div class="icon">📦</div>

      <p>Produk tidak ditemukan.</p>

    </div>

    `;

  }

  return data.map(function(item){

    const gambar =
      item.gambar ||
      item.image_url ||
      "";

    return `

    <div class="produk">

      <div class="gambar">

        ${
          gambar
          ? `
          <img
          src="${escapeHTML(gambar)}"
          alt="${escapeHTML(item.nama)}"
          style="
          width:100%;
          height:100%;
          object-fit:cover;
          border-radius:10px">
          `
          : `
          ${item.icon || "📦"}
          `
        }

      </div>

      <div class="info">

        <div class="nama">
        ${escapeHTML(item.nama)}
        </div>

        <div class="harga">
        ${rupiah(item.harga)}
        </div>

        <div class="lokasi">
        📍 ${escapeHTML(item.lokasi || "-")}
        </div>

        <div style="
        font-size:11px;
        color:#777;
        margin-top:4px">

        Stok: ${item.stok ?? 0}

        </div>

        <button
        class="tombol"
        onclick="tambahKeranjang(${item.id})">

        + Keranjang

        </button>

      </div>

    </div>

    `;

  }).join("");

}


function tambahKeranjang(id){

  const semuaProduk =
    window.semuaProdukBELMALT || produkData;

  const produk =
    semuaProduk.find(function(item){

      return Number(item.id) === Number(id);

    });

  if(!produk) {

    pesan("Produk tidak ditemukan");

    return;

  }

  if(produk.stok <= 0){

    pesan("Stok produk habis");

    return;

  }

  let item =
    keranjang.find(function(item){

      return Number(item.id) === Number(id);

    });

  if(item){

    if(item.jumlah >= produk.stok){

      pesan("Jumlah melebihi stok");

      return;

    }

    item.jumlah++;

  }else{

    keranjang.push({

      id: produk.id,

      nama: produk.nama,

      harga: produk.harga,

      icon: produk.icon || "📦",

      gambar: produk.gambar || "",

      jumlah: 1

    });

  }

  simpanKeranjang();

  pesan(
    produk.nama + " masuk keranjang 🛒"
  );

}


/* =========================
   PENCARIAN
========================= */

function cariProduk(){

const kata=
document.getElementById("cari")
.value
.toLowerCase()
.trim();

const hasil=
produkData.filter(function(item){

return (

item.nama.toLowerCase().includes(kata) ||

item.kategori.toLowerCase().includes(kata) ||

item.lokasi.toLowerCase().includes(kata)

);

});

document.getElementById("halaman").innerHTML=`

<div class="judul">
Hasil pencarian
</div>

<div style="font-size:13px;color:#777;margin-bottom:15px">
${kata ? "Menampilkan hasil untuk: "+kata : "Semua produk"}
</div>

<div class="produk-grid">

${buatProdukHTML(hasil)}

</div>

`;

}


/* =========================
   KERANJANG
========================= */

function updateBadge(){

const badge=
document.getElementById("badge");

if(!badge) return;

const jumlah=
keranjang.reduce(function(total,item){

return total+item.jumlah;

},0);

if(jumlah>0){

badge.innerText=jumlah;

badge.style.display="flex";

}else{

badge.style.display="none";

}

}


function lihatKeranjang(){

setNav("navKeranjang");

document.getElementById("halaman").innerHTML=`

<div class="judul">
🛒 Keranjang Belanja
</div>

<div id="isiKeranjang"></div>

`;

tampilkanKeranjang();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function tampilkanKeranjang(){

const box=
document.getElementById("isiKeranjang");

if(!box) return;

if(keranjang.length===0){

box.innerHTML=`

<div class="card kosong">

<div class="icon">🛒</div>

<p>Keranjang masih kosong.</p>

<p style="font-size:12px;margin-top:8px">
Yuk pilih produk favoritmu!
</p>

<button class="checkout"
onclick="beranda()">

Belanja Sekarang

</button>

</div>

`;

return;

}

let html="";

let total=0;

keranjang.forEach(function(item,index){

const subtotal=
item.harga*item.jumlah;

total+=subtotal;

html+=`

<div class="card">

<div class="item-keranjang">

<div class="item-icon">
${item.icon}
</div>

<div class="item-detail">

<div class="item-nama">
${item.nama}
</div>

<div class="item-harga">
${rupiah(item.harga)}
</div>

<div class="jumlah">

<button onclick="kurangi(${index})">
−
</button>

<span>${item.jumlah}</span>

<button onclick="tambahJumlah(${index})">
+
</button>

</div>

</div>

<button class="hapus"
onclick="hapusItem(${index})">

🗑️

</button>

</div>

<div style="text-align:right;font-weight:bold;margin-top:10px">

Subtotal:
${rupiah(subtotal)}

</div>

</div>

`;

});

html+=`

<div class="card">

<div class="total-row">

<span>Total</span>

<span style="color:#1261c9">
${rupiah(total)}
</span>

</div>

<button class="checkout"
onclick="bukaCheckout()">

Lanjut ke Checkout

</button>

</div>

`;

box.innerHTML=html;

async function buatPesanan(){

  if(!pengguna || !pengguna.id){
    pesan("Silakan login terlebih dahulu");
    return;
  }

  const nama =
    document.getElementById("namaPenerima")
    .value.trim();

  const nomor =
    document.getElementById("nomorHP")
    .value.trim();

  const alamat =
    document.getElementById("alamat")
    .value.trim();

  const kota =
    document.getElementById("kota")
    .value;

  if(nama.length < 3){
    pesan("Masukkan nama penerima");
    return;
  }

  if(!/^[0-9+ -]{8,15}$/.test(nomor)){
    pesan("Nomor HP tidak valid");
    return;
  }

  if(alamat.length < 8){
    pesan("Alamat terlalu pendek");
    return;
  }

  if(!kota){
    pesan("Pilih kota/kabupaten");
    return;
  }

  const pilihanPengiriman =
    document.querySelector(
      'input[name="pengiriman"]:checked'
    );

  const pilihanPembayaran =
    document.querySelector(
      'input[name="pembayaran"]:checked'
    );

  if(!pilihanPengiriman){
    pesan("Pilih metode pengiriman");
    return;
  }

  if(!pilihanPembayaran){
    pesan("Pilih metode pembayaran");
    return;
  }

  if(!keranjang || keranjang.length === 0){
    pesan("Keranjang masih kosong");
    return;
  }

  const pengiriman =
    pilihanPengiriman.value;

  const pembayaran =
    pilihanPembayaran.value;

  let subtotal = 0;

  keranjang.forEach(function(item){

    subtotal +=
      Number(item.harga) *
      Number(item.jumlah);

  });

  const ongkir =
    pengiriman === "Express"
    ? 20000
    : 10000;

  const total =
    subtotal + ongkir;

  const alamatLengkap =
    nama +
    ", " +
    nomor +
    ", " +
    alamat +
    ", " +
    kota;

  // Simpan pesanan utama ke Supabase
  const { data: pesananBaru, error: orderError } =
    await supabaseClient
    .from("Orders")
    .insert({
      Total: total,
      Status: "Menunggu diproses",
      "Metode-pembayaran": pembayaran,
      Alamat: alamatLengkap,
      user_id: pengguna.id
    })
    .select()
    .single();

  if(orderError){

    console.error(orderError);

    pesan(
      "Pesanan gagal disimpan: " +
      orderError.message
    );

    return;
  }

  // Simpan semua produk yang dibeli
  const itemPesanan =
    keranjang.map(function(item){

      return {
        Order_id: pesananBaru.id,
        product_id: item.id,
        Jumlah: Number(item.jumlah),
        Harga: Number(item.harga)
      };

    });

  const { error: itemError } =
    await supabaseClient
    .from("Order_items")
    .insert(itemPesanan);

  if(itemError){

    console.error(itemError);

    pesan(
      "Pesanan dibuat tetapi detail produk gagal disimpan: " +
      itemError.message
    );

    return;
  }

  // Tetap buat nomor pesanan untuk tampilan aplikasi
  const nomorPesanan =
    "BM" +
    Date.now()
    .toString()
    .slice(-8);

  const dataPesanan = {

    id: pesananBaru.id,

    nomorPesanan,

    nama,
    nomor,
    alamat,
    kota,

    pengiriman,
    pembayaran,

    subtotal,
    ongkir,
    total,

    produk: [...keranjang],

    status: "Menunggu diproses",

    tanggal:
      new Date()
      .toLocaleString("id-ID")

  };

  // Simpan juga ke data lokal aplikasi
  pesanan.unshift(dataPesanan);

  simpanPesanan();

  keranjang = [];

  simpanKeranjang();

  tampilkanPesananBerhasil(dataPesanan);

}

        placeholder="Jelaskan produk kamu"></textarea>
    </div>

    <div class="form-group">
      <label>Foto Produk</label>

      <input
        id="produkGambar"
        type="file"
        accept="image/*">

      <small>
        Pilih foto produk dari Galeri HP
      </small>
    </div>

    <button
      class="checkout"
      onclick="simpanProduk()">

      💾 Simpan Produk

    </button>

    <button
      onclick="tokoSaya()"
      style="
      width:100%;
      margin-top:10px;
      padding:12px;
      border:1px solid #ddd;
      border-radius:8px;
      background:white">

      ← Kembali

    </button>

  </div>

  `;

}

async function simpanProduk(){

  if(!pengguna || !pengguna.id){
    pesan("Silakan login terlebih dahulu");
    return;
  }

  // Cari toko milik pengguna
  const { data: toko, error: tokoError } =
    await supabaseClient
      .from("shops")
      .select("id")
      .eq("owner_id", pengguna.id)
      .maybeSingle();

  if(tokoError){
    console.error(tokoError);
    pesan("Gagal mencari toko: " + tokoError.message);
    return;
  }

  if(!toko){
    pesan("Kamu belum memiliki toko. Silakan buka toko terlebih dahulu.");
    tokoSaya();
    return;
  }

  // Ambil data form
  const nama =
    document.getElementById("produkNama").value.trim();

  const harga =
    Number(document.getElementById("produkHarga").value);

  const stok =
    Number(document.getElementById("produkStok").value);

  const kategori =
    document.getElementById("produkKategori").value;

  const lokasi =
    document.getElementById("produkLokasi").value.trim();

  const deskripsi =
    document.getElementById("produkDeskripsi").value.trim();

  const fileInput =
    document.getElementById("produkGambar");

  const file =
    fileInput.files[0];

  // Validasi
  if(!nama){
    pesan("Nama produk wajib diisi");
    return;
  }

  if(!harga || harga < 1){
    pesan("Masukkan harga yang benar");
    return;
  }

  if(stok < 0){
    pesan("Stok tidak boleh negatif");
    return;
  }

  if(!kategori){
    pesan("Pilih kategori produk");
    return;
  }

  if(!file){
    pesan("Silakan pilih foto produk dari Galeri");
    return;
  }

  // Pastikan file adalah gambar
  if(!file.type.startsWith("image/")){
    pesan("File yang dipilih harus berupa gambar");
    return;
  }

  // Nama file unik
  const namaFile =
    pengguna.id + "_" +
    Date.now() + "_" +
    file.name.replace(/[^a-zA-Z0-9.-]/g, "_");

  const path =
    namaFile;

  // Upload foto ke Supabase Storage
  const { error: uploadError } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(path, file, {
        cacheControl: "3600",
        upsert: false
      });

  if(uploadError){

    console.error(uploadError);

    pesan("Foto gagal diupload: " + uploadError.message);

    return;
  }

  // Ambil URL foto
  const { data: publicUrlData } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(path);

  const gambar =
    publicUrlData.publicUrl;

  // Simpan produk ke database
  const { data, error } =
    await supabaseClient
      .from("products")
      .insert({
        name: nama,
        price: harga,
        stock: stok,
        category: kategori,
        location: lokasi,
        description: deskripsi,
        image_url: gambar,
        active: true,
        seller_id: pengguna.id,
        shop_id: toko.id
      })
      .select()
      .single();

  if(error){

    console.error(error);

    pesan("Produk gagal disimpan: " + error.message);

    return;
  }

  pesan("Produk berhasil ditambahkan 🎉");

  tokoSaya();

}

async function muatProdukSaya(){

  const wadah =
    document.getElementById("produkSaya");

  if(!wadah){
    return;
  }

  if(!pengguna || !pengguna.id){
    wadah.innerHTML =
      "<p>Silakan login terlebih dahulu.</p>";
    return;
  }

  // Cari toko milik pengguna yang sedang login
  const { data: toko, error: tokoError } =
    await supabaseClient
    .from("shops")
    .select("id")
    .eq("owner_id", pengguna.id)
    .maybeSingle();

  if(tokoError){

    console.error(tokoError);

    wadah.innerHTML =
      "<p>Gagal mencari toko.</p>";

    return;
  }

  if(!toko){

    wadah.innerHTML = `
      <p style="
      text-align:center;
      color:#777;
      font-size:13px">

      Kamu belum mempunyai toko.

      </p>
    `;

    return;
  }

  // Ambil produk yang hanya milik toko ini
  const { data, error } =
    await supabaseClient
    .from("products")
    .select("*")
    .eq("shop_id", toko.id)
    .order("created_at", {
      ascending: false
    });

  if(error){

    console.error(error);

    wadah.innerHTML =
      "<p>Gagal memuat produk.</p>";

    return;
  }

  if(!data || data.length === 0){

    wadah.innerHTML = `
      <p style="
      text-align:center;
      color:#777;
      font-size:13px">

      Kamu belum mempunyai produk.

      </p>
    `;

    return;
  }

  wadah.innerHTML = data.map(produk => `

    <div class="card"
    style="margin-top:10px">

      ${
        produk.image_url
        ? `
        <img
        src="${escapeHTML(produk.image_url)}"
        style="
        width:100%;
        height:160px;
        object-fit:cover;
        border-radius:10px">
        `
        : `
        <div style="
        height:160px;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#f5f5f5;
        border-radius:10px;
        font-size:50px">

        📦

        </div>
        `
      }

      <h3>
      ${escapeHTML(produk.name)}
      </h3>

      <p style="
      color:#e53935;
      font-weight:bold">

      Rp ${Number(produk.price)
        .toLocaleString("id-ID")}

      </p>

      <p style="
      font-size:13px;
      color:#777">

      Stok: ${produk.stock}

      </p>

      <p style="
      font-size:13px;
      color:#777">

      📍 ${escapeHTML(produk.location || "-")}

      </p>

    </div>

  `).join("");

}

async function loginDemo(){

  const email =
    document.getElementById("loginEmail")
    .value.trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  if(!email.includes("@")){
    pesan("Masukkan email yang benar");
    return;
  }

  if(password.length < 6){
    pesan("Password minimal 6 karakter");
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){
    pesan("Login gagal: " + error.message);
    return;
  }

  const nama =
    document.getElementById("loginNama")
    ?.value.trim() || "";

   pengguna = {
    nama: nama,
    email: email,
    id: data.user.id
  };

  localStorage.setItem(
    "penggunaBELMALT",
    JSON.stringify(pengguna)
  );

  pesan("Berhasil masuk ke BELMALT 👋");

  akun();
}

async function daftarAkun(){

  const nama =
    document.getElementById("loginNama")
    .value.trim();

  const email =
    document.getElementById("loginEmail")
    .value.trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  if(nama.length < 2){
    pesan("Masukkan nama kamu");
    return;
  }

  if(!email.includes("@")){
    pesan("Masukkan email yang benar");
    return;
  }

  if(password.length < 6){
    pesan("Password minimal 6 karakter");
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

  if(error){
    pesan("Pendaftaran gagal: " + error.message);
    return;
  }

  if(data.user){

    localStorage.setItem(
      "penggunaBELMALT",
      JSON.stringify({
        nama: nama,
        email: email,
        id: data.user.id
      })
    );

    if(data.session){
      pesan("Akun berhasil dibuat dan kamu sudah masuk 🎉");
      akun();
    } else {
      pesan("Akun berhasil dibuat 🎉 Silakan cek email untuk konfirmasi.");
    }

  }

  document.getElementById("loginPassword").value = "";

}
  
function logout(){

pengguna=null;

localStorage.removeItem(
"penggunaBELMALT"
);

pesan("Kamu sudah keluar");

tampilkanLogin();

}

function escapeHTML(teks){

return String(teks)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
