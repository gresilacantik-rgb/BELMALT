<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BELMALT - Belanja Maluku Terlengkap</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#222;
  padding-bottom:100px;
}

button,input,textarea,select{
  font-family:Arial,sans-serif;
}

button{
  cursor:pointer;
}

header{
  background:linear-gradient(135deg,#1261c9,#2584ef);
  color:white;
  padding:20px 16px 24px;
  border-radius:0 0 25px 25px;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.slogan{
  font-size:13px;
  margin-top:4px;
  opacity:.9;
}

.search{
  margin-top:17px;
  background:white;
  color:#777;
  padding:13px 14px;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:8px;
}

.search input{
  border:0;
  outline:0;
  width:100%;
  font-size:14px;
}

.container{
  padding:18px 16px;
}

.banner{
  background:linear-gradient(135deg,#1261c9,#2584ef);
  color:white;
  border-radius:18px;
  padding:21px;
  margin-bottom:22px;
  box-shadow:0 5px 15px rgba(18,97,201,.18);
}

.banner h2{
  font-size:20px;
  margin-bottom:7px;
}

.banner p{
  font-size:13px;
  line-height:1.5;
}

.judul{
  font-size:19px;
  font-weight:bold;
  margin:20px 0 13px;
}

.kategori{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:3px 2px 8px;
}

.kategori::-webkit-scrollbar{
  display:none;
}

.kategori-item{
  min-width:82px;
  background:white;
  border-radius:15px;
  padding:13px 7px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
  border:2px solid transparent;
  transition:.2s;
}

.kategori-item:active{
  transform:scale(.96);
}

.kategori-icon{
  font-size:27px;
  margin-bottom:5px;
}

.kategori-item p{
  font-size:11px;
}

.produk-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.produk{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.gambar{
  height:140px;
  background:#eaf0f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
}

.info{
  padding:12px;
}

.nama{
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}

.harga{
  color:#1261c9;
  font-weight:bold;
  font-size:15px;
}

.lokasi{
  font-size:11px;
  color:#777;
  margin-top:5px;
}

.tombol,
.checkout{
  margin-top:10px;
  width:100%;
  border:0;
  background:#1261c9;
  color:white;
  padding:11px;
  border-radius:9px;
  font-weight:bold;
}

.secondary{
  background:#e9edf3;
  color:#333;
}

.danger{
  background:#ffe5e5;
  color:#c00;
}

.bottom{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  height:70px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-radius:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.18);
  z-index:10;
}

.nav{
  text-align:center;
  color:#777;
  font-size:10px;
  min-width:50px;
  position:relative;
  cursor:pointer;
}

.nav span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav.active{
  color:#1261c9;
  font-weight:bold;
}

.badge{
  position:absolute;
  top:-4px;
  right:5px;
  background:red;
  color:white;
  font-size:10px;
  min-width:17px;
  height:17px;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
}

#pesan{
  position:fixed;
  top:20px;
  left:15px;
  right:15px;
  background:#222;
  color:white;
  padding:13px;
  border-radius:10px;
  text-align:center;
  display:none;
  z-index:100;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.item-keranjang{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.item-icon{
  width:55px;
  height:55px;
  border-radius:12px;
  background:#eaf0f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  flex-shrink:0;
}

.item-detail{
  flex:1;
}

.item-nama{
  font-weight:bold;
  font-size:14px;
}

.item-harga{
  color:#1261c9;
  font-size:13px;
  margin-top:4px;
}

.jumlah{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.jumlah button{
  width:28px;
  height:28px;
  border:0;
  border-radius:7px;
  background:#1261c9;
  color:white;
  font-size:17px;
}

.jumlah span{
  min-width:20px;
  text-align:center;
  font-weight:bold;
}

.hapus{
  border:0;
  background:#ffe5e5;
  color:#c00;
  padding:7px;
  border-radius:7px;
  font-size:11px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  font-size:17px;
  font-weight:bold;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  outline:none;
  background:white;
}

.form-group textarea{
  min-height:90px;
  resize:none;
}

.radio-box{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin-bottom:8px;
  font-size:13px;
}

.ringkasan-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  padding:7px 0;
}

.kosong{
  text-align:center;
  padding:50px 15px;
  color:#777;
}

.kosong .icon{
  font-size:55px;
  margin-bottom:12px;
}

.success{
  text-align:center;
  padding:30px 15px;
}

.success-icon{
  font-size:65px;
}

.nomor-pesanan{
  color:#1261c9;
  font-weight:bold;
  margin:12px 0;
}

.login-box{
  max-width:500px;
  margin:20px auto;
}

.avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#eaf0f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  margin:0 auto 15px;
}

.menu-akun{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.menu-akun:last-child{
  border-bottom:0;
}

.menu-akun button{
  border:0;
  background:none;
  font-size:14px;
}

.order-status{
  display:inline-block;
  background:#e7f1ff;
  color:#1261c9;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.chat-box{
  background:white;
  border-radius:16px;
  padding:15px;
  min-height:350px;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.chat-message{
  background:#eaf0f8;
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
  font-size:13px;
}

.chat-input{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.chat-input input{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:11px;
  outline:none;
}

.chat-input button{
  border:0;
  background:#1261c9;
  color:white;
  padding:0 15px;
  border-radius:10px;
}

.hidden{
  display:none!important;
}

@media(max-width:380px){
  .produk-grid{
    gap:9px;
  }

  .gambar{
    height:125px;
  }
}
</style>
</head>

<body>

<header>

<script>

/* =========================
   DATA BELMALT
========================= */

const SUPABASE_URL = "https://exgpfdkrwiwrgrekqdzi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_w5k8ukza2fql_Iil6ABKtw_4EYXhtpV";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

/* =========================
   DATA LOKAL
========================= */

let keranjang =
JSON.parse(localStorage.getItem("keranjangBELMALT")) || [];

let pesanan =
JSON.parse(localStorage.getItem("pesananBELMALT")) || [];

let pengguna =
JSON.parse(localStorage.getItem("penggunaBELMALT")) || null;


/* =========================
   UTILITAS
========================= */

function rupiah(angka){

return "Rp"+
Number(angka).toLocaleString("id-ID");

}


function simpanKeranjang(){

localStorage.setItem(
"keranjangBELMALT",
JSON.stringify(keranjang)
);

updateBadge();

}


function simpanPesanan(){

localStorage.setItem(
"pesananBELMALT",
JSON.stringify(pesanan)
);

}


function pesan(teks){

const box=document.getElementById("pesan");

box.innerText=teks;

box.style.display="block";

clearTimeout(window.timerPesan);

window.timerPesan=setTimeout(function(){

box.style.display="none";

},1800);

}


function setNav(id){

document.querySelectorAll(".nav")
.forEach(function(item){

item.classList.remove("active");

});

const nav=document.getElementById(id);

if(nav){
nav.classList.add("active");
}

}


/* =========================
   BERANDA
========================= */

function beranda(){

setNav("navBeranda");

document.getElementById("cari").value="";

renderBeranda();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

async function renderBeranda(){

  document.getElementById("halaman").innerHTML=`

    <div class="banner">

      <h2>Belanja Mudah di BELMALT 🛍️</h2>

      <p>
      Temukan berbagai produk pilihan dari penjual
      di Maluku Utara dengan mudah.
      </p>

    </div>

    <div class="judul">
    Kategori
    </div>

    <div class="kategori">

    ${buatKategoriHTML()}

    </div>

    <div class="judul">
    Produk Pilihan
    </div>

    <div
    class="produk-grid"
    id="produk">

      <p style="
      grid-column:1/-1;
      text-align:center;
      color:#777">

      Memuat produk...

      </p>

    </div>

  `;

  const { data, error } =
    await supabaseClient
    .from("products")
    .select("*")
    .eq("active", true)
    .order("created_at", {
      ascending: false
    });

  if(error){

    console.error(error);

    document.getElementById("produk").innerHTML =
      buatProdukHTML(produkData);

    return;
  }


const produkSupabase = [];

for(const produk of (data || [])){

let namaToko = "Toko";  

if(produk.shop_id){  

  const { data: toko } =  
    await supabaseClient  
    .from("shops")  
    .select("name")  
    .eq("id", produk.shop_id)  
    .maybeSingle();  

  if(toko && toko.name){  

    namaToko = toko.name;  

  }  

}  

produkSupabase.push({  

  id: produk.id,  

  shop_id: produk.shop_id,  

  nama: produk.name,  

  harga: Number(produk.price),  

  stok: produk.stock,  

  kategori: produk.category,  

  lokasi: produk.location || "",  

  deskripsi: produk.description || "",  

  gambar: produk.image_url || "",  

  namaToko: namaToko  

});

}

const semuaProduk = [

...produkSupabase 

];

window.semuaProdukBELMALT = semuaProduk;

document.getElementById("produk").innerHTML =
buatProdukHTML(semuaProduk);

}

/* =========================
   KATEGORI
========================= */

const kategoriData=[

["Fashion","👕"],
["Kecantikan","💄"],
["Makanan","🍜"],
["Elektronik","📱"],
["Rumah","🏠"],
["Aksesoris","👜"],
["Jasa","🛠️"],
["Lainnya","📦"]

];


function buatKategoriHTML(){

return kategoriData.map(function(item){

return `

<div class="kategori-item"
onclick="filterKategori('${item[0]}')">

<div class="kategori-icon">
${item[1]}
</div>

<p>${item[0]}</p>

</div>

`;

}).join("");

}


async function tampilkanKategori(){

  setNav("navKategori");

  document.getElementById("halaman").innerHTML=`

    <div class="judul">
      🛍️ Semua Kategori
    </div>

    <div class="kategori"
    style="
      overflow:visible;
      display:grid;
      grid-template-columns:repeat(3,1fr)">

      ${buatKategoriHTML()}

    </div>

    <div id="hasilKategori">

      <div class="judul">
        Semua Produk
      </div>

      <div
        class="produk-grid"
        id="semuaProdukKategori">

        <p style="
          grid-column:1/-1;
          text-align:center;
          color:#777">

          Memuat produk...

        </p>

      </div>

    </div>

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("active", true)
      .order("created_at", {
        ascending:false
      });


  if(error){

    console.error(
      "Gagal memuat produk kategori:",
      error
    );

    document.getElementById(
      "semuaProdukKategori"
    ).innerHTML = `

      <p style="
        grid-column:1/-1;
        text-align:center;
        color:#777">

        Gagal memuat produk.

      </p>

    `;

    return;
  }


  const produkSupabase = [];


  for(const produk of (data || [])){

    let namaToko = "Toko";


    if(produk.shop_id){

      const { data: toko } =
        await supabaseClient
          .from("shops")
          .select("name")
          .eq("id", produk.shop_id)
          .maybeSingle();


      if(toko && toko.name){

        namaToko = toko.name;

      }

    }


    produkSupabase.push({

      id: produk.id,

      shop_id: produk.shop_id,

      nama: produk.name,

      harga: Number(produk.price),

      stok: produk.stock,

      kategori: produk.category,

      lokasi: produk.location || "",

      deskripsi: produk.description || "",

      gambar: produk.image_url || "",

      namaToko: namaToko

    });

  }


  window.semuaProdukBELMALT =
    produkSupabase;


  document.getElementById(
    "semuaProdukKategori"
  ).innerHTML =
    buatProdukHTML(produkSupabase);

}


function filterKategori(namaKategori){

  const semua =
    window.semuaProdukBELMALT || [];

  const hasil =
    semua.filter(function(item){

      return String(item.kategori || "")
        .toLowerCase()
        ===
        String(namaKategori || "")
        .toLowerCase();

    });


  const box =
    document.getElementById("hasilKategori");


  if(!box){

    const halaman =
      document.getElementById("halaman");

    if(!halaman){
      return;
    }

    halaman.innerHTML = `

      <div class="judul">

        <button
          onclick="beranda()"
          style="
            border:none;
            background:none;
            font-size:22px;
            cursor:pointer">

          ←

        </button>

        ${escapeHTML(namaKategori)}

      </div>

      <div
        class="produk-grid"
        style="padding:10px">

        ${buatProdukHTML(hasil)}

      </div>

    `;

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    return;
  }


  box.innerHTML = `

    <div class="judul">
      ${escapeHTML(namaKategori)}
    </div>

    <div class="produk-grid">

      ${buatProdukHTML(hasil)}

    </div>

  `;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function tambahKeranjang(id){

  const semuaProduk =
    window.semuaProdukBELMALT || [];

  const produk =
    semuaProduk.find(function(item){

      return Number(item.id) === Number(id);

    });

  if(!produk){

    pesan("Produk tidak ditemukan");

    return;

  }

  if(produk.stok <= 0){

    pesan("Stok produk habis");

    return;

  }

  let item =
    keranjang.find(function(item){

      return Number(item.id) === Number(id);

    });

  if(item){

    if(item.jumlah >= produk.stok){

      pesan("Jumlah melebihi stok");

      return;

    }

    item.jumlah++;

  }else{

    keranjang.push({

      id: produk.id,

      nama: produk.nama,

      harga: produk.harga,

      icon: produk.icon || "📦",

      image_url: produk.image_url || produk.gambar || "",

      jumlah: 1

    });

  }

  simpanKeranjang();

  pesan(
    produk.nama + " masuk keranjang 🛒"
  );

  }

function kurangi(index){

if(!keranjang[index]) return;

if(keranjang[index].jumlah>1){

keranjang[index].jumlah--;

}else{

keranjang.splice(index,1);

}

simpanKeranjang();

tampilkanKeranjang();

}


function hapusItem(index){

if(!keranjang[index]) return;

const nama=
keranjang[index].nama;

keranjang.splice(index,1);

simpanKeranjang();

tampilkanKeranjang();

pesan(
nama+" dihapus dari keranjang"
);

}

async function buatPesanan(){

  if(!pengguna || !pengguna.id){
    pesan("Silakan login terlebih dahulu");
    return;
  }

  const nama =
    document.getElementById("namaPenerima").value.trim();

  const nomor =
    document.getElementById("nomorHP").value.trim();

  const alamat =
    document.getElementById("alamat").value.trim();

  const kota =
    document.getElementById("kota").value;

  if(nama.length < 3){
    pesan("Masukkan nama penerima");
    return;
  }

  if(!/^[0-9+ -]{8,15}$/.test(nomor)){
    pesan("Nomor HP tidak valid");
    return;
  }

  if(alamat.length < 8){
    pesan("Alamat terlalu pendek");
    return;
  }

  if(!kota){
    pesan("Pilih kota/kabupaten");
    return;
  }

  const pilihanPengiriman =
    document.querySelector(
      'input[name="pengiriman"]:checked'
    );

  const pilihanPembayaran =
    document.querySelector(
      'input[name="pembayaran"]:checked'
    );

  if(!pilihanPengiriman){
    pesan("Pilih metode pengiriman");
    return;
  }

  if(!pilihanPembayaran){
    pesan("Pilih metode pembayaran");
    return;
  }

  if(!keranjang || keranjang.length === 0){
    pesan("Keranjang masih kosong");
    return;
  }


  const pengiriman =
    pilihanPengiriman.value;

  const pembayaran =
    pilihanPembayaran.value;


  let subtotal = 0;

  keranjang.forEach(function(item){

    subtotal +=
      Number(item.harga) *
      Number(item.jumlah);

  });


  const ongkir =
    pengiriman === "Express"
    ? 20000
    : 10000;


  const total =
    subtotal + ongkir;


  const alamatLengkap =
    nama +
    ", " +
    nomor +
    ", " +
    alamat +
    ", " +
    kota;


  // ==========================
  // NOMOR PESANAN
  // ==========================

  const nomorPesanan =
    "BM" +
    Date.now()
    .toString()
    .slice(-8);


  // ==========================
  // STATUS PEMBAYARAN
  // ==========================

  let statusPembayaran =
    "Belum dibayar";


  // COD tidak dianggap sebagai
  // pembayaran yang tertunda

  if(
    pembayaran.toLowerCase() === "cod"
  ){

    statusPembayaran =
      "COD";

  }


  // ==========================
  // SIMPAN PESANAN
  // ==========================

  const { data: pesananBaru, error: orderError } =
    await supabaseClient
    .from("Orders")
    .insert({

      "Nomor-pesanan":
        nomorPesanan,

      Total:
        total,

      Ongkir:
        ongkir,

      Status:
        "Menunggu diproses",

      "Status-pembayaran":
        statusPembayaran,

      "Metode-pembayaran":
        pembayaran,

      Alamat:
        alamatLengkap,

      user_id:
        pengguna.id

    })
    .select()
    .single();


  if(orderError){

    console.error(orderError);

    pesan(
      "Pesanan gagal disimpan: " +
      orderError.message
    );

    return;
  }


  // ==========================
  // DETAIL PRODUK
  // ==========================

  const itemPesanan =
    keranjang.map(function(item){

      return {

        Order_id:
          pesananBaru.id,

        product_id:
          item.id,

        Jumlah:
          Number(item.jumlah),

        Harga:
          Number(item.harga)

      };

    });


  const { error: itemError } =
    await supabaseClient
    .from("Order_items")
    .insert(itemPesanan);


  if(itemError){

    console.error(itemError);

    pesan(
      "Pesanan dibuat tetapi detail produk gagal disimpan: " +
      itemError.message
    );

    return;
  }


  // ==========================
  // DATA LOKAL
  // ==========================

  const dataPesanan = {

    id:
      pesananBaru.id,

    nomorPesanan:
      nomorPesanan,

    nama:
      nama,

    nomor:
      nomor,

    alamat:
      alamat,

    kota:
      kota,

    pengiriman:
      pengiriman,

    pembayaran:
      pembayaran,

    statusPembayaran:
      statusPembayaran,

    subtotal:
      subtotal,

    ongkir:
      ongkir,

    total:
      total,

    produk:
      [...keranjang],

    status:
      "Menunggu diproses",

    tanggal:
      new Date()
      .toLocaleString("id-ID")

  };


  pesanan.unshift(
    dataPesanan
  );


  simpanPesanan();


  keranjang = [];

  simpanKeranjang();


  tampilkanPesananBerhasil(
    dataPesanan
  );

}

      await supabaseClient

    if(orderError){

let channelNotifikasiChat = null;

function mulaiNotifikasiChat(){

  if(!pengguna || !pengguna.id){
    return;
  }

  if(channelNotifikasiChat){

    supabaseClient
      .removeChannel(
        channelNotifikasiChat
      );

    channelNotifikasiChat = null;
  }

  // Perbarui badge saat mulai
  updateBadgeChat();

  channelNotifikasiChat =
    supabaseClient
      .channel(
        "notifikasi-chat-" +
        pengguna.id
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "receiver_id=eq." +
            pengguna.id
        },

        async function(payload){

          const pesanBaru =
            payload.new;

          if(!pesanBaru){
            return;
          }

          console.log(
            "Pesan chat baru:",
            pesanBaru
          );

          // Perbarui angka badge
          await updateBadgeChat();

          // Tampilkan notifikasi
          tampilkanNotifikasiChat(
            pesanBaru
          );

          // Cek chat yang sedang dibuka
          const box =
            document.getElementById(
              "daftarPesanChat"
            );

          const lawanId =
            box
            ? box.dataset.lawanId
            : null;

          // Jika sedang membuka chat
          // dengan pengirim pesan baru
          if(
            box &&
            lawanId &&
            String(lawanId) ===
            String(pesanBaru.sender_id)
          ){

            // Langsung tandai sudah dibaca
            await tandaiChatSudahDibaca(
              pesanBaru.sender_id
            );

            // Langsung tampilkan pesan baru
            await muatPesanChat(
              pesanBaru.sender_id
            );

          }

        }

      )

      .subscribe();

}
  async function tampilkanNotifikasiChat(pesanBaru){

  if(!pesanBaru){
    return;
  }

  let namaPengirim = "Pengguna";

  if(pesanBaru.sender_id){

    const { data } =
      await supabaseClient
        .from("profiles")
        .select("nama")
        .eq("id", pesanBaru.sender_id)
        .maybeSingle();

    if(data && data.nama){
      namaPengirim = data.nama;
    }

  }

  const teks =
    pesanBaru.pesan ||
    "Anda menerima pesan baru";

  // Notifikasi dalam aplikasi
  pesan(
    "💬 " +
    namaPengirim +
    ": " +
    teks
  );

  // Jika browser/WebView mendukung notifikasi
  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){

    new Notification(
      "💬 Pesan Baru BELMALT",
      {
        body:
          namaPengirim +
          ": " +
          teks
      }
    );

  }

  }

  async function muatChatMasukPenjual(){

  const box =
    document.getElementById(
      "daftarChatMasuk"
    );

  if(!box){
    return;
  }

  if(!pengguna || !pengguna.id){
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "receiver_id",
        pengguna.id
      )
      .order(
        "dibuat_pada",
        {
          ascending:false
        }
      );

  if(error){

    console.error(
      "Gagal memuat chat masuk:",
      error
    );

    box.innerHTML = `
      <p style="
        text-align:center;
        color:#d32f2f">

        Gagal memuat chat masuk.

      </p>
    `;

    return;
  }

  if(!data || data.length === 0){

    box.innerHTML = `
      <p style="
        text-align:center;
        color:#777;
        padding:30px 10px">

        💬 Belum ada pesan masuk.

      </p>
    `;

    return;
  }


  // ==============================
  // SATUKAN BERDASARKAN PEMBELI
  // ==============================

  const percakapan = {};

  data.forEach(function(item){

    if(!percakapan[item.sender_id]){
      percakapan[item.sender_id] = item;
    }

  });


  const daftar =
    Object.values(percakapan);


  // ==============================
  // AMBIL NAMA PEMBELI
  // ==============================

  const hasil = await Promise.all(

    daftar.map(async function(item){

      let namaPembeli = "Pembeli";

      const { data: profil } =
        await supabaseClient
          .from("profiles")
          .select("nama")
          .eq(
            "id",
            item.sender_id
          )
          .maybeSingle();

      if(
        profil &&
        profil.nama
      ){

        namaPembeli =
          profil.nama;

      }

      return {

        ...item,
        namaPembeli:
          namaPembeli

      };

    })

  );


  box.innerHTML =
    hasil.map(function(item){

      return `

        <div
          onclick="bukaChatDariPenjual('${String(
            item.sender_id
          )}')"
          style="
            padding:15px;
            margin-bottom:10px;
            border:1px solid #eee;
            border-radius:12px;
            cursor:pointer">

          <div style="
            font-weight:bold;
            font-size:15px">

            💬 ${escapeHTML(
              item.namaPembeli
            )}

          </div>

          <div style="
            margin-top:6px;
            font-size:14px;
            color:#555">

            ${escapeHTML(
              item.pesan || ""
            )}

          </div>

          <div style="
            margin-top:6px;
            font-size:11px;
            color:#888">

            ${
              item.dibuat_pada
              ? new Date(
                  item.dibuat_pada
                ).toLocaleString(
                  "id-ID"
                )
              : ""
            }

          </div>

        </div>

      `;

    }).join("");

  }

  async function bukaChatDariPenjual(pembeliId){

  if(!pengguna || !pengguna.id){
    pesan("Silakan login terlebih dahulu");
    return;
  }

  if(!pembeliId){
    pesan("Pembeli tidak ditemukan");
    return;
  }

  let namaPembeli = "Pembeli";

  const { data } =
    await supabaseClient
      .from("profiles")
      .select("nama")
      .eq("id", pembeliId)
      .maybeSingle();

  if(data && data.nama){
    namaPembeli = data.nama;
  }

  const halaman =
    document.getElementById("halaman");

  if(!halaman){
    return;
  }

  halaman.innerHTML = `

    <div class="judul">
      💬 Chat dengan ${escapeHTML(namaPembeli)}
    </div>

    <button
      onclick="chatMasukPenjual()"
      style="
        border:none;
        background:none;
        color:#1261C9;
        font-weight:bold;
        font-size:14px;
        padding:5px 0;
        margin-bottom:10px">

      ← Kembali ke Chat Masuk

    </button>

    <div
      id="daftarPesanChat"
      class="card"
      style="
        min-height:300px;
        max-height:450px;
        overflow-y:auto">

      <p style="
        text-align:center;
        color:#777">

        Memuat chat...

      </p>

    </div>

    <div
      class="card"
      style="
        display:flex;
        gap:8px;
        align-items:center">

      <input
        id="inputPesanChat"
        type="text"
        placeholder="Tulis pesan..."
        maxlength="1000"
        style="
          flex:1;
          padding:12px;
          border:1px solid #ddd;
          border-radius:10px">

      <button
        onclick="kirimPesanKePembeli('${String(pembeliId)}')"
        style="
          border:none;
          background:#1261C9;
          color:white;
          padding:12px 16px;
          border-radius:10px;
          font-weight:bold">

        ➤

      </button>

    </div>

  `;

  await muatPesanChat(pembeliId);

}

  async function kirimPesanKePembeli(pembeliId){

  if(!pengguna || !pengguna.id){
    pesan("Silakan login terlebih dahulu");
    return;
  }

  if(!pembeliId){
    pesan("Pembeli tidak ditemukan");
    return;
  }

  const input =
    document.getElementById(
      "inputPesanChat"
    );

  if(!input){
    return;
  }

  const teks =
    input.value.trim();

  if(!teks){
    pesan("Tulis pesan terlebih dahulu");
    return;
  }

  const { error } =
    await supabaseClient
      .from("messages")
      .insert({
        sender_id: pengguna.id,
        receiver_id: pembeliId,
        pesan: teks
      });

  if(error){

    console.error(
      "Gagal mengirim balasan:",
      error
    );

    pesan(
      "Pesan gagal dikirim: " +
      error.message
    );

    return;
  }

  input.value = "";

  await muatPesanChat(pembeliId);

}

async function bukaPesananKategori(kategori){

  const wadah =
    document.getElementById("halaman");

  if(!wadah){
    return;
  }


  let judul = "Pesanan";
  let statusFilter = [];


  // ==========================
  // KATEGORI
  // ==========================

  if(kategori === "baru"){

    judul = "🆕 Pesanan Baru";

    statusFilter = [
      "Menunggu diproses"
    ];

  }

  else if(kategori === "diproses"){

    judul = "⚙️ Pesanan Diproses";

    statusFilter = [
      "Diproses"
    ];

  }

  else if(kategori === "kurir"){

    judul = "🚚 Diserahkan ke Kurir";

    statusFilter = [
      "Diserahkan ke kurir"
    ];

  }

  else if(kategori === "pengiriman"){

    judul = "🛵 Dalam Pengiriman";

    statusFilter = [
      "Dalam perjalanan",
      "Kurir menuju alamat pembeli"
    ];

  }

  else if(kategori === "selesai"){

    judul = "✅ Pesanan Selesai";

    statusFilter = [
      "Pesanan telah diterima"
    ];

  }

  else if(kategori === "dibatalkan"){

    judul = "❌ Pesanan Dibatalkan";

    statusFilter = [
      "Dibatalkan"
    ];

  }


  // ==========================
  // TAMPILKAN HALAMAN
  // ==========================

  wadah.innerHTML = `

    <div class="judul">
      ${judul}
    </div>


    <button
      onclick="bukaPesananMasuk()"
      style="
        border:none;
        background:none;
        color:#1261C9;
        font-weight:bold;
        font-size:14px;
        padding:5px 0;
        margin-bottom:10px;
        cursor:pointer">

      ← Kembali ke Pesanan Masuk

    </button>


    <div class="card">

      <div id="pesananKategori">

        <p style="
          text-align:center;
          color:#777">

          Memuat pesanan...

        </p>

      </div>

    </div>

  `;


  const hasil =
    document.getElementById("pesananKategori");


  if(!hasil){
    return;
  }


  if(!pengguna || !pengguna.id){

    hasil.innerHTML = `

      <p style="
        text-align:center;
        color:#777">

        Silakan login terlebih dahulu.

      </p>

    `;

    return;
  }


  try{


    // ==========================
    // CARI TOKO PENJUAL
    // ==========================

    const { data: toko, error: tokoError } =
      await supabaseClient
        .from("shops")
        .select("id")
        .eq("owner_id", pengguna.id)
        .maybeSingle();


    if(tokoError){

      console.error(tokoError);

      hasil.innerHTML = `
        <p style="
          text-align:center;
          color:#d00">

          Gagal mencari toko.

        </p>
      `;

      return;
    }


    if(!toko){

      hasil.innerHTML = `
        <p style="
          text-align:center;
          color:#777">

          Toko belum ditemukan.

        </p>
      `;

      return;
    }


    // ==========================
    // AMBIL PRODUK TOKO
    // ==========================

    const { data: produk, error: produkError } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("shop_id", toko.id);


    if(produkError){

      console.error(produkError);

      hasil.innerHTML = `
        <p style="
          text-align:center;
          color:#d00">

          Gagal mengambil produk toko.

        </p>
      `;

      return;
    }


    if(!produk || produk.length === 0){

      hasil.innerHTML = `
        <p style="
          text-align:center;
          color:#777">

          Belum ada produk di toko.

        </p>
      `;

      return;
    }


    const productIds =
      produk.map(item => item.id);


    // ==========================
    // AMBIL ITEM PESANAN
    // ==========================

    const { data: itemPesanan, error: itemError } =
      await supabaseClient
        .from("Order_items")
        .select("*")
        .in("product_id", productIds);


    if(itemError){

      console.error(itemError);

      hasil.innerHTML = `
        <p style="
          text-align:center;
          color:#d00">

          Gagal mengambil item pesanan.

        </p>
      `;

      return;
    }


    if(!itemPesanan || itemPesanan.length === 0){

      hasil.innerHTML = `
        <p style="
          text-align:center;
          color:#777">

          Belum ada pesanan.

        </p>
      `;

      return;
    }


    // ==========================

  async function prosesPesananPenjual(
  orderId,
  statusBaru,
  kategori
){

  if(!orderId || !statusBaru){
    return;
  }


  const konfirmasi =
    confirm(
      "Ubah status pesanan menjadi:\n\n" +
      statusBaru +
      "?"
    );


  if(!konfirmasi){
    return;
  }


  try{

    const { error } =
      await supabaseClient
        .from("Orders")
        .update({
          Status: statusBaru
        })
        .eq("id", orderId);


    if(error){

      console.error(
        "Gagal mengubah status:",
        error
      );

      pesan(
        "Gagal mengubah status pesanan: " +
        error.message
      );

      return;
    }


    pesan(
      "Status pesanan berhasil diubah menjadi " +
      statusBaru
    );


    // Muat ulang kategori yang sedang dibuka
    bukaPesananKategori(kategori);


  }catch(error){

    console.error(error);

    pesan(
      "Terjadi kesalahan saat memproses pesanan."
    );

  }

}

  if(file.size > 5 * 1024 * 1024){

    return;

          height:120px;

          border:1px solid #ddd">

  };

  reader.readAsDataURL(file);

  async function uploadLogoToko(file){

  if(!file){
    return null;
  }

  if(!pengguna || !pengguna.id){
    pesan("Silakan login terlebih dahulu");
    return null;
  }

  const ekstensi =
    file.name.split(".").pop().toLowerCase();

  const namaFile =
  pengguna.id + "_" + Date.now() + "." + ekstensi;

const path =
  namaFile;

  const { error: uploadError } =
    await supabaseClient
      .storage
      .from("shop_logos")
      .upload(path, file, {
        cacheControl: "3600",
        upsert: false
      });

  if(uploadError){

    console.error("Upload logo gagal:", uploadError);

    pesan("Foto gagal diupload: " + uploadError.message);

    return null;
  }

  const { data } =
    supabaseClient
      .storage
      .from("shop_logos")
      .getPublicUrl(path);

  if(!data || !data.publicUrl){

    pesan("URL foto tidak berhasil dibuat");

    return null;
  }

  return data.publicUrl;

}

async function muatPesananMasuk(){

  const wadah =
    document.getElementById("pesananMasuk");

  if(!wadah){
    return;
  }

  if(!pengguna || !pengguna.id){

    wadah.innerHTML =
      "<p>Silakan login terlebih dahulu.</p>";

    return;
  }

  // ==============================
  // CARI TOKO MILIK PENJUAL
  // ==============================

  const { data: toko, error: tokoError } =
    await supabaseClient
    .from("shops")
    .select("id")
    .eq("owner_id", pengguna.id)
    .maybeSingle();

  if(tokoError){

    console.error(tokoError);

    wadah.innerHTML =
      "<p>Gagal memeriksa toko.</p>";

    return;
  }

  if(!toko){

    wadah.innerHTML =
      "<p>Kamu belum memiliki toko.</p>";

    return;
  }


  // ==============================
  // AMBIL PRODUK MILIK TOKO
  // ==============================

  const { data: produk, error: produkError } =
    await supabaseClient
    .from("products")
    .select("*")
    .eq("shop_id", toko.id);

  if(produkError){

    console.error(produkError);

    wadah.innerHTML =
      "<p>Gagal memuat produk toko.</p>";

    return;
  }

  if(!produk || produk.length === 0){

    wadah.innerHTML = `
      <p style="
      text-align:center;
      color:#777;
      font-size:13px">

      Belum ada pesanan masuk.

      </p>
    `;

    return;
  }


  // ==============================
  // BUAT DAFTAR ID PRODUK
  // ==============================

  const productIds =
    produk.map(function(item){
      return item.id;
    });


  // ==============================
  // AMBIL ITEM PESANAN
  // ==============================

  const { data: itemPesanan, error: itemError } =
    await supabaseClient
    .from("Order_items")
    .select("*")
    .in("product_id", productIds);

  if(itemError){

    console.error(itemError);

    wadah.innerHTML =
      "<p>Gagal memuat pesanan.</p>";

    return;
  }

  if(!itemPesanan || itemPesanan.length === 0){

    wadah.innerHTML = `
      <p style="
      text-align:center;
      color:#777;
      font-size:13px">

      Belum ada pesanan masuk.

      </p>
    `;

    return;
  }


  // ==============================
  // AMBIL DATA PESANAN
  // ==============================

  const orderIds =
    [
      ...new Set(
        itemPesanan.map(function(item){
          return item.Order_id;
        })
      )
    ];


  const { data: orders, error: orderError } =
    await supabaseClient
    .from("Orders")
    .select("*")
    .in("id", orderIds)
    .order("id", {
      ascending:false
    });

  if(orderError){

    console.error(orderError);

    wadah.innerHTML =
      "<p>Gagal memuat data pesanan.</p>";

    return;
  }

  if(!orders || orders.length === 0){

    wadah.innerHTML = `
      <p style="
      text-align:center;
      color:#777;
      font-size:13px">

      Belum ada pesanan masuk.

      </p>
    `;

    return;
  }


  // ==============================
  // INDEX PRODUK
  // ==============================

  const daftarProduk = {};

  produk.forEach(function(item){

    daftarProduk[item.id] = item;

  });


  // ==============================
  // TAMPILKAN PESANAN
  // ==============================

  wadah.innerHTML =
    orders.map(function(order){

      const status =
        String(
          order.Status ||
          "Menunggu diproses"
        ).trim();

      const statusNormal =
        status.toLowerCase();


      // ==========================
      // PRODUK DALAM PESANAN
      // ==========================

      const itemOrder =
        itemPesanan.filter(function(item){

          return String(item.Order_id) ===
            String(order.id);

        });


      const daftarProdukPesanan =
        itemOrder.map(function(item){

          const produkItem =
            daftarProduk[item.product_id];

          if(!produkItem){
            return "";
          }

          const jumlah =
            Number(item.Jumlah || 0);

          const harga =
            Number(
              item.Harga ??
              produkItem.price ??
              0
            );

          const subtotal =
            jumlah * harga;

          const gambar =
            produkItem.image_url || "";


          return `

            <div style="
              display:flex;
              gap:10px;
              padding:10px 0;
              border-bottom:1px solid #eee">

              <div style="
                width:65px;
                height:65px;
                flex-shrink:0;
                border-radius:8px;
                overflow:hidden;
                background:#f5f5f5;
                display:flex;
                align-items:center;
                justify-content:center">

                ${
                  gambar
                  ?
                  `
                  <img
                    src="${escapeHTML(gambar)}"
                    loading="lazy"
                    decoding="async"
                    style="
                    width:100%;
                    height:100%;
                    object-fit:cover">
                  `
                  :
                  "📦"
                }

              </div>


              <div style="
                flex:1;
                min-width:0">

                <div style="
                  font-weight:bold;
                  font-size:14px">

                  ${escapeHTML(
                    produkItem.name || "Produk"
                  )}

                </div>


                <div style="
                  font-size:12px;
                  color:#777;
                  margin-top:4px">

                  ${jumlah} ×
                  Rp ${harga.toLocaleString("id-ID")}

                </div>


                <div style="
                  margin-top:4px;
                  font-size:13px;
                  font-weight:bold;
                  color:#1261C9">

                  Subtotal:
                  Rp ${subtotal.toLocaleString("id-ID")}

                </div>

              </div>

            </div>

          `;

        }).join("");


      // ==========================
      // TOMBOL AKSI PENJUAL
      // ==========================

      let tombol = "";


      // STATUS 1
      if(

              font-weight:bold;
              cursor:pointer">

            ❌ Batalkan Pesanan

          </button>

        `;

      }


      // STATUS 2
      else if(
        statusNormal === "diproses"
      ){

        tombol = `

          <button
            onclick="serahkanPesananKeKurir('${escapeHTML(String(order.id))}')"
            style="
              width:100%;
              margin-top:10px;

              border-radius:8px;

          </button>


          <button

            style="
              width:100%;
              margin-top:8px;
              padding:11px;

          </button>

      }


      // STATUS 3

        statusNormal === "diserahkan ke kurir"
      ){

        tombol = `

          <div style="

            text-align:center;

      }


      // STATUS PENGIRIMAN
      else if(

        statusNormal === "pesanan telah diterima"
      ){

        tombol = `

          <div style="

      // STATUS DIBATALKAN
      else if(

        tombol = `

      const posisi =

async function prosesPesananPenjual(orderId){

  const konfirmasi =
    confirm("Proses pesanan ini?");

  if(!konfirmasi){
    return;
  }

  const { data, error } =
    await supabaseClient
    .from("Orders")
    .update({
      Status: "Diproses"
    })
    .eq("id", orderId)
    .select("id, Status");

  if(error){

    console.error(
      "ERROR PROSES PESANAN:",
      error
    );

    alert(
      "Gagal memproses pesanan:\n" +
      error.message
    );

    return;
  }

  if(!data || data.length === 0){

    alert(
      "Pesanan tidak berubah.\n\n" +
      "Database tidak menemukan pesanan yang dapat diperbarui."
    );

    return;
  }

  alert(
    "Pesanan sekarang berstatus Diproses."
  );

  await muatPesananMasuk();
  }

async function batalkanPesananPenjual(orderId){

  const konfirmasi =
    confirm("Batalkan pesanan ini?");

  if(!konfirmasi){
    return;
  }

  // Periksa status terbaru
  const { data: order, error: cekError } =
    await supabaseClient
    .from("Orders")
    .select("id, Status")
    .eq("id", orderId)
    .maybeSingle();

  if(cekError){

    console.error(
      "ERROR CEK PESANAN:",
      cekError
    );

    alert(
      "Gagal memeriksa pesanan:\n" +
      cekError.message
    );

    return;
  }

  if(!order){

    alert(
      "Pesanan tidak ditemukan."
    );

    return;
  }

  const status =
    String(order.Status || "")
    .trim()
    .toLowerCase();

  if(
    status !== "menunggu diproses" &&
    status !== "menunggu" &&
    status !== "diproses"
  ){

    alert(
      "Pesanan tidak dapat dibatalkan karena sudah diserahkan kepada kurir atau sudah selesai."
    );

    await muatPesananMasuk();

    return;
  }

  const { data, error } =
    await supabaseClient
    .from("Orders")
    .update({
      Status: "Dibatalkan"
    })
    .eq("id", orderId)
    .select("id, Status");

  if(error){

    console.error(
      "ERROR BATALKAN PESANAN:",
      error
    );

    alert(
      "Gagal membatalkan pesanan:\n" +
      error.message
    );

    return;
  }

  if(!data || data.length === 0){

    alert(
      "Pesanan tidak berubah.\n\n" +
      "Database tidak mengizinkan perubahan pesanan."
    );

    return;
  }

  alert(
    "Pesanan telah dibatalkan."
  );

  await muatPesananMasuk();
}

async function hapusPesananPenjual(orderId){

  const konfirmasi =
    confirm(
      "Hapus pesanan yang dibatalkan ini?"
    );

  if(!konfirmasi){
    return;
  }

  // Pastikan status masih Dibatalkan
  const { data: order, error: cekError } =
    await supabaseClient
    .from("Orders")
    .select("id, Status")
    .eq("id", orderId)
    .maybeSingle();

  if(cekError){

    console.error(
      "ERROR CEK HAPUS:",
      cekError
    );

    alert(
      "Gagal memeriksa pesanan:\n" +
      cekError.message
    );

    return;
  }

  if(!order){

    alert(
      "Pesanan tidak ditemukan."
    );

    await muatPesananMasuk();

    return;
  }

  if(
    String(order.Status || "")
      .trim()
      .toLowerCase() !== "dibatalkan"
  ){

    alert(
      "Pesanan hanya dapat dihapus jika statusnya Dibatalkan."
    );

    await muatPesananMasuk();

    return;
  }

  const { data, error } =
    await supabaseClient
    .from("Orders")
    .delete()
    .eq("id", orderId)
    .select("id");

  if(error){

    console.error(
      "ERROR HAPUS PESANAN:",
      error
    );

    alert(
      "Gagal menghapus pesanan:\n" +
      error.message
    );

    return;
  }

  if(!data || data.length === 0){

    alert(
      "Pesanan tidak terhapus.\n\n" +
      "Database tidak mengizinkan penghapusan pesanan."
    );

    return;
  }

  alert(
    "Pesanan telah dihapus."
  );

  await muatPesananMasuk();
  }

async function simpanToko(){

  if(!pengguna || !pengguna.id){
    pesan("Silakan login terlebih dahulu");
    return;
  }

  const nama =
    document.getElementById("tokoNama").value.trim();

  const lokasi =
    document.getElementById("tokoLokasi").value.trim();

  const phone =
    document.getElementById("tokoPhone").value.trim();

  const deskripsi =
    document.getElementById("tokoDeskripsi").value.trim();

  const fileInput =
    document.getElementById("tokoLogoFile");

  const file =
    fileInput ? fileInput.files[0] : null;

  if(!nama){
    pesan("Nama toko wajib diisi");
    return;
  }

  // Cek apakah pengguna sudah memiliki toko
  const { data: tokoLama, error: cekError } =
    await supabaseClient
      .from("shops")
      .select("id")
      .eq("owner_id", pengguna.id)
      .maybeSingle();

  if(cekError){

    console.error(cekError);

    pesan(
      "Gagal memeriksa toko: " +
      cekError.message
    );

    return;
  }

  if(tokoLama){

    pesan("Kamu sudah memiliki toko");

    tokoSaya();

    return;
  }

  // Upload foto toko jika dipilih
  let logoUrl = null;

  if(file){

    logoUrl = await uploadLogoToko(file);

    if(!logoUrl){

      return;

    }

  }

  // Simpan toko
  const { data: tokoBaru, error } =
    await supabaseClient
      .from("shops")
      .insert({

        owner_id: pengguna.id,

        name: nama,

        location: lokasi,

        phone: phone,

        description: deskripsi,

        logo_url: logoUrl

      })
      .select()
      .single();

  if(error){

    console.error(error);

    pesan(
      "Toko gagal dibuat: " +
      error.message
    );

    return;

  }

  pesan("Toko berhasil dibuat 🎉");

  // Masuk ke halaman toko
  tokoSaya();

function previewFotoProduk(event){

  const file = event.target.files[0];

  const preview =
    document.getElementById("previewFoto");

  if(!file || !preview){
    return;
  }

  // Pastikan file berupa gambar
  if(!file.type.startsWith("image/")){

    pesan(
      "File yang dipilih harus berupa foto"
    );

    event.target.value = "";

    preview.innerHTML = "";

    return;
  }

  // Maksimal 5 MB
  if(file.size > 5 * 1024 * 1024){

    pesan(
      "Ukuran foto maksimal 5 MB"
    );

    event.target.value = "";

    preview.innerHTML = "";

    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    preview.innerHTML = `

      <img
        src="${e.target.result}"
        alt="Preview foto produk"
        style="
          width:150px;
          height:150px;
          object-fit:cover;
          border-radius:12px;
          border:1px solid #ddd;">

      <p style="
        font-size:12px;
        color:#777;">

        Foto berhasil dipilih

      </p>

    `;

  };

  reader.readAsDataURL(file);

}

async function simpanProduk(){

  if(!pengguna || !pengguna.id){
    pesan("Silakan login terlebih dahulu");
    return;
  }

  const { data: toko, error: tokoError } =
    await supabaseClient
      .from("shops")
      .select("id")
      .eq("owner_id", pengguna.id)
      .maybeSingle();

  if(tokoError){

    console.error(tokoError);

    pesan(
      "Gagal mencari toko: " +
      tokoError.message
    );

    return;
  }

  if(!toko){

    pesan(
      "Kamu belum memiliki toko. " +
      "Silakan buka toko terlebih dahulu."
    );

    tokoSaya();

    return;
  }

  const nama =
    document.getElementById("produkNama").value.trim();

  const harga =
    Number(
      document.getElementById("produkHarga").value
    );

  const stok =
    Number(
      document.getElementById("produkStok").value
    );

  const kategori =
    document.getElementById("produkKategori").value;

  const lokasi =
    document.getElementById("produkLokasi").value.trim();

  const deskripsi =
    document.getElementById("produkDeskripsi").value.trim();

  const fileInput =
    document.getElementById("produkGambar");

  const file =
    fileInput ? fileInput.files[0] : null;

  if(!nama){

    pesan("Nama produk wajib diisi");

    return;
  }

  if(!harga || harga < 1){

    pesan("Masukkan harga yang benar");

    return;
  }

  if(stok < 0){

    pesan("Stok tidak boleh negatif");

    return;
  }

  if(!kategori){

    pesan("Pilih kategori produk");

    return;
  }

  if(!file){

    pesan(
      "Silakan pilih foto produk dari Galeri"
    );

    return;
  }

  if(!file.type.startsWith("image/")){

    pesan(
      "File yang dipilih harus berupa gambar"
    );

    return;
  }

  if(file.size > 5 * 1024 * 1024){

    pesan(
      "Ukuran foto maksimal 5 MB"
    );

    return;
  }

  const namaFile =
    pengguna.id +
    "_" +
    Date.now() +
    "_" +
    file.name.replace(
      /[^a-zA-Z0-9.-]/g,
      "_"
    );

  const path =
    namaFile;

  const { error: uploadError } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        path,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );

  if(uploadError){

    console.error(
      "Upload foto produk gagal:",
      uploadError
    );

    pesan(
      "Foto gagal diupload: " +
      uploadError.message
    );

    return;
  }

  const { data: publicUrlData } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(path);

  if(
    !publicUrlData ||
    !publicUrlData.publicUrl
  ){

    pesan(
      "URL foto produk tidak berhasil dibuat"
    );

    return;
  }

  const gambar =
    publicUrlData.publicUrl;

  const { error } =
    await supabaseClient
      .from("products")
      .insert({

        name: nama,

        price: harga,

        stock: stok,

        category: kategori,

        location: lokasi,

        description: deskripsi,

        image_url: gambar,

        active: true,

        seller_id: pengguna.id,

        shop_id: toko.id

      })
      .select()
      .single();

  if(error){

    console.error(
      "Gagal menyimpan produk:",
      error
    );

    pesan(
      "Produk gagal disimpan: " +
      error.message
    );

    return;
  }

  pesan(
    "Produk berhasil ditambahkan 🎉"
  );

  tokoSaya();

}

      <p style="
      font-size:13px;

        🗑️ Hapus Produk

      </button>

    </div>

  `).join("");

}

async function hapusProduk(id){

  const yakin = confirm(
    "Yakin ingin menghapus produk ini?"
  );

  if(!yakin){
    return;
  }

  try{

    const { error } =
      await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);

    if(error){

      console.error("Gagal menghapus produk:", error);

      pesan(
        "Gagal menghapus produk: " +
        error.message
      );

      return;
    }

    pesan("Produk berhasil dihapus");

    muatProdukSaya();

  }catch(error){

    console.error(error);

    pesan(
      "Terjadi kesalahan saat menghapus produk"
    );

  }

}

async function daftarAkun(){

  const nama =
    document.getElementById("loginNama")
    .value.trim();

  const email =
    document.getElementById("loginEmail")
    .value.trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  if(nama.length < 2){
    pesan("Masukkan nama kamu");
    return;
  }

  if(!email.includes("@")){
    pesan("Masukkan email yang benar");
    return;
  }

  if(password.length < 6){
    pesan("Password minimal 6 karakter");
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

  if(error){
    pesan("Pendaftaran gagal: " + error.message);
    return;
  }

  if(data.user){

    localStorage.setItem(
      "penggunaBELMALT",
      JSON.stringify({
        nama: nama,
        email: email,
        id: data.user.id
      })
    );

    if(data.session){
      pesan("Akun berhasil dibuat dan kamu sudah masuk 🎉");
      akun();
    } else {
      pesan("Akun berhasil dibuat 🎉 Silakan cek email untuk konfirmasi.");
    }

  }

  document.getElementById("loginPassword").value = "";

}

function escapeHTML(teks){

return String(teks)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
